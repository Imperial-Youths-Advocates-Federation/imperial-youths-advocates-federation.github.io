services:
  - type: web
    name: iyaf-live-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iyaf-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://imperial-youth-advocates-federation.github.io
      - key: FRONTEND_URL
        value: https://imperial-youth-advocates-federation.github.io/iyaf.github.io
      - key: ADMIN_EMAIL
        value: iyafzim003@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: IYAF <onboarding@resend.dev>

databases:
  - name: iyaf-postgres
